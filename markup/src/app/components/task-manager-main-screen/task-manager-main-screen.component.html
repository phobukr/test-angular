<div class='top-panel'><div class='task-name-field'><label for='taskNameField'>Task Name:</label><input id='taskNameField' type='text' [(ngModel)]='taskName'></div><div class='priority-combo-box'><label for='priorityComboBox'>Priority:</label><select id='priorityComboBox' [(ngModel)]='priority'><option>High</option><option>Medium</option><option>Low</option></select></div><div class='add-task-button'><button id='addButton' (click)='onAddTask()'>Add Task</button></div></div><div class='center-panel'><div class='task-table'><table id='taskTable'><tr><th>Name</th><th>Priority</th><th>Status</th></tr><tr *ngFor='let task of tasks'><td>{{ task.name }}</td><td>{{ task.priority }}</td><td>{{ task.status }}</td></tr></table></div></div><div class='bottom-panel'><div class='left-controls'><div class='mark-done-button'><button id='markDoneButton' (click)='onMarkDone()'>Mark Done</button></div><div class='move-up-button'><button id='moveUpButton' (click)='onMoveUp()'>Move Up</button></div><div class='move-down-button'><button id='moveDownButton' (click)='onMoveDown()'>Move Down</button></div><div class='delete-button'><button id='deleteButton' (click)='onDelete()'>Delete</button></div></div><div class='filter-panel'><div class='filter-combo-box'><label for='filterComboBox'>Filter:</label><select id='filterComboBox' [(ngModel)]='filter'><option>All</option><option>TODO</option><option>DONE</option></select></div><div class='apply-filter-button'><button id='applyFilterButton' (click)='onApplyFilter()'>Apply Filter</button></div><div class='task-count-label'><span id='taskCountLabel'>Tasks: {{ tasks.length }}</span></div></div></div>
