<!DOCTYPE html><html><head><link rel='stylesheet' href='style.css'></head><body><div class='top-panel'><label for='taskNameField'>Task Name:</label><input id='taskNameField' class='task-name-field' type='text'><label for='priorityComboBox'>Priority:</label><select id='priorityComboBox' class='priority-combo-box'><option>High</option><option>Medium</option><option>Low</option></select><button id='addButton' class='add-task-button'>Add Task</button></div><div class='center-panel'><table id='taskTable' class='task-table'><tr><th>Name</th><th>Priority</th><th>Status</th></tr></table></div><div class='bottom-panel'><div class='left-controls'><button id='markDoneButton' class='mark-done-button'>Mark Done</button><button id='moveUpButton' class='move-up-button'>Move Up</button><button id='moveDownButton' class='move-down-button'>Move Down</button><button id='deleteButton' class='delete-button'>Delete</button></div><div class='filter-panel'><label for='filterComboBox'>Filter:</label><select id='filterComboBox' class='filter-combo-box'><option>All</option><option>TODO</option><option>DONE</option></select><button id='applyFilterButton' class='apply-filter-button'>Apply Filter</button><span id='taskCountLabel' class='task-count-label'>Tasks: 0</span></div></div></body></html>
