<!DOCTYPE html><html><head><link rel='stylesheet' href='style.css'></head><body><div class='top-panel'><div class='task-name-field'><label for='taskNameField'>Task Name:</label><input id='taskNameField' type='text'></div><div class='priority-combo-box'><label for='priorityComboBox'>Priority:</label><select id='priorityComboBox'><option>High</option><option>Medium</option><option>Low</option></select></div><div class='add-task-button'><button id='addButton'>Add Task</button></div></div><div class='center-panel'><div class='task-table'><table id='taskTable'><tr><th>Name</th><th>Priority</th><th>Status</th></tr></table></div></div><div class='bottom-panel'><div class='left-controls'><div class='mark-done-button'><button id='markDoneButton'>Mark Done</button></div><div class='move-up-button'><button id='moveUpButton'>Move Up</button></div><div class='move-down-button'><button id='moveDownButton'>Move Down</button></div><div class='delete-button'><button id='deleteButton'>Delete</button></div></div><div class='filter-panel'><div class='filter-combo-box'><label for='filterComboBox'>Filter:</label><select id='filterComboBox'><option>All</option><option>TODO</option><option>DONE</option></select></div><div class='apply-filter-button'><button id='applyFilterButton'>Apply Filter</button></div><div class='task-count-label'><span id='taskCountLabel'>Tasks: 0</span></div></div></div></body></html>
