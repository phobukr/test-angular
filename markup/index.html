<!DOCTYPE html><html><head><link rel='stylesheet' href='style.css'></head><body><div class='top-panel'><label for='taskNameField'>Task Name:</label><input id='taskNameField' class='input-field' type='text'><label for='priorityComboBox'>Priority:</label><select id='priorityComboBox' class='dropdown-menu'><option>High</option><option>Medium</option><option>Low</option></select><button id='addButton' class='action-button'>Add Task</button></div><div class='center-panel'><table id='taskTable' class='task-table'><tr><th>Name</th><th>Priority</th><th>Status</th></tr><tr><td>Task 1</td><td>High</td><td>TODO</td></tr></table></div><div class='bottom-panel'><div class='left-controls'><button id='markDoneButton' class='action-button'>Mark Done</button><button id='moveUpButton' class='action-button'>Move Up</button><button id='moveDownButton' class='action-button'>Move Down</button><button id='deleteButton' class='action-button'>Delete</button></div><div class='filter-panel'><label for='filterComboBox'>Filter:</label><select id='filterComboBox' class='dropdown-menu'><option>All</option><option>TODO</option><option>DONE</option></select><button id='applyFilterButton' class='action-button'>Apply Filter</button><span id='taskCountLabel' class='label'>Tasks: 0</span></div></div></body></html>
