

<div class='top-panel'>
  <label for='taskNameField'>Task Name:</label>
  <input id='taskNameField' class='input-field' type='text' [(ngModel)]='newTaskName'>
  <label for='priorityComboBox'>Priority:</label>
  <select id='priorityComboBox' class='dropdown-menu' [(ngModel)]='newTaskPriority'>
    <option>High</option>
    <option>Medium</option>
    <option>Low</option>
  </select>
  <button id='addButton' class='add-button' (click)='onAddTask()'>Add Task</button>
</div>
<div class='center-panel'>
  <table id='taskTable' class='task-table'>
    <tr>
      <th>Name</th>
      <th>Priority</th>
      <th>Status</th>
    </tr>
    <tr *ngFor='let task of tasks' (click)='onRowSelect(task)' (dblclick)='onRowDeselect(task)' [ngClass]="{'selected-row': selectedRow === task}">
      <td>{{ task.name }}</td>
      <td>{{ task.priority }}</td>
      <td>{{ task.status }}</td>
    </tr>
  </table>
</div>
<div class='bottom-panel'>
  <button id='deleteButton' class='control-button' (click)='onDelete()' [ngClass]="{'control-button': true, 'disabled': selectedRow === null}">Delete</button>
  <button id='moveDownButton' class='control-button' (click)='onMoveDown()' [ngClass]="{'control-button': true, 'disabled': getSelectedRow() === null}">Move Down</button>
  <button id='moveUpButton' class='control-button' (click)='onMoveUp()' [ngClass]="{'control-button': true, 'disabled': getSelectedRow() === null}">Move Up</button>
  <button id='markDoneButton' class='control-button' (click)='onMarkDone()' [ngClass]="{'control-button': true, 'disabled': selectedRow === null}">Mark Done</button>
  <button id='applyFilterButton' class='control-button' (click)='onApplyFilter()' [ngClass]="{'control-button': true, 'disabled': filter === 'All'}">Apply Filter</button>
  <button id='updateStatusButton' class='control-button' (click)='onUpdateTaskStatus(selectedTask)'>Update Status</button>
  <label for='filterComboBox'>Filter:</label>
  <select id='filterComboBox' class='dropdown-menu' [(ngModel)]='filter' (ngModelChange)='onFilterSelect()'>
    <option>All</option>
    <option>TODO</option>
    <option>DONE</option>
  </select>
  <span id='taskCountLabel' class='task-counter'>Tasks: {{ taskCount }}</span>
</div>
