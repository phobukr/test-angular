

<div class='top-panel'><input type='text' id='taskNameField' class='task-name-field' [(ngModel)]='taskName' placeholder='Task Name:' style='width: 100%; background-color: #f7f7f7'><select id='priorityComboBox' class='priority-combo-box' [(ngModel)]='priority'><option>High</option><option>Medium</option><option>Low</option></select><button id='addButton' class='add-task-button' (click)='onAddTask()'>Add Task</button></div><div class='center-panel'><table id='taskTable' class='task-table' [ngClass]="{'high-priority': task.priority === 'High', 'medium-priority': task.priority === 'Medium', 'low-priority': task.priority === 'Low'}" (click)='onTaskSelected($event, task)'><tr><th>Name</th><th>Priority</th><th>Status</th></tr><tr *ngFor='let task of tasks'><td>{{ task.name }}</td><td>{{ task.priority }}</td><td>{{ task.status }}</td></tr></table></div><div class='bottom-panel'><div class='left-controls'><button id='markDoneButton' class='mark-done-button' (click)='onMarkDone()'>Mark Done</button><button id='moveUpButton' class='move-up-button' (click)='onMoveUp()'>Move Up</button><button id='moveDownButton' class='move-down-button' (click)='onMoveDown()'>Move Down</button><button id='deleteButton' class='delete-button' (click)='onDelete()'>Delete</button></div><div class='filter-panel'><select id='filterComboBox' class='filter-combo-box' [(ngModel)]='filter' (ngModelChange)='onFilterChange($event)'><option>All</option><option>TODO</option><option>DONE</option></select><button id='applyFilterButton' class='apply-filter-button' (click)='onApplyFilter()'>Apply Filter</button><span id='taskCountLabel' class='task-count-label'>Tasks: {{ tasks.length }}</span></div></div>
