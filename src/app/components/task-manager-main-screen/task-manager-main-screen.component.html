

<div class='top-panel'><label for='taskNameField'>Task Name:</label><input id='taskNameField' class='input-field' type='text' [(ngModel)]='taskName'><label for='priorityComboBox'>Priority:</label><select id='priorityComboBox' class='dropdown-menu' [(ngModel)]='priority'><option>High</option><option>Medium</option><option>Low</option></select><button id='addButton' class='action-button' (click)='addTask()'>Add Task</button></div><div class='center-panel'><table id='taskTable' class='task-table'><tr><th>Name</th><th>Priority</th><th>Status</th></tr><tr *ngFor='let task of tasks; let i = index' (click)='onTaskSelected(i)' [ngClass]='{ "selected-cell": i === selectedTaskIndex }'><td [ngClass]='getPriorityClass(task.priority)'>{{ task.name }}</td><td [ngClass]='getPriorityClass(task.priority)'>{{ task.priority }}</td><td [ngClass]='getPriorityClass(task.priority)'>{{ task.status }}</td></tr></table></div><div class='bottom-panel'><div class='left-controls'><button id='markDoneButton' class='action-button' (click)='onMarkDone()'>Mark Done</button><button id='moveUpButton' class='action-button' (click)='onMoveUp()'>Move Up</button><button id='moveDownButton' class='action-button' (click)='onMoveDown()'>Move Down</button><button id='deleteButton' class='action-button' (click)='onDelete()'>Delete</button></div><div class='filter-panel'><label for='filterComboBox'>Filter:</label><select id='filterComboBox' class='dropdown-menu' [(ngModel)]='filter' (ngModelChange)='onApplyFilter()'><option>All</option><option>TODO</option><option>DONE</option></select><span id='taskCountLabel' class='label'>{{ filteredTasks.length }} Tasks</span></div></div>
